name: pages

# Deploy the Chess.Web in-browser app to GitHub Pages.
#
# Chess.Web is a Blazor WebAssembly app that runs the chess engine (Chess.Lib) and the
# WebGl.Renderer backend entirely in the browser — a fully static site, no server. It is
# IN Chess.sln and under CPM, so dotnet-desktop.yml compiles it on every push and PR;
# this workflow owns the part that one cannot do — the AOT publish and the Pages deploy.
#
# Runs on pushes to main that touch the app or the engine it embeds (so the live site
# tracks the latest engine), on PRs touching the same paths (build only, no deploy —
# an AOT publish is the one way to break the site that a plain solution build cannot
# catch, and finding that out post-merge means a broken deploy), and on manual dispatch
# for a forced redeploy. Publish target is browser-wasm (OS-neutral), so ubuntu is fine.
#
# NOTE: enable Pages once in repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'Chess.Web/**'
      - 'Chess.Lib/**'
      - 'Chess.UCI/**'
      - 'tools/**'
      - 'Directory.Packages.props'
      - '.github/workflows/pages.yml'
      # Markdown inside those trees (Chess.Web/docs/, a README) cannot change the published
      # site. A negation is the only way to say that: `paths` and `paths-ignore` may not both
      # appear on one event, and later patterns override earlier ones, so this must stay last.
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'Chess.Web/**'
      - 'Chess.Lib/**'
      - 'Chess.UCI/**'
      - 'tools/**'
      - 'Directory.Packages.props'
      - '.github/workflows/pages.yml'
      # Keep in step with the push filter above — see the note there on why this is a
      # negation rather than a paths-ignore.
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Blazor WASM Release publish relinks the runtime natively (Emscripten) to
      # tree-shake it smaller; the wasm-tools workload provides that toolchain.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Pre-bake the MSDF glyph atlas (.sdfg) for the chess charset so the WebGL renderer
      # starts with zero runtime rasterization. Pure managed — no GPU on the runner needed.
      - name: Bake SDF glyph atlas
        run: dotnet run --project tools/BakeSdfAtlas -c Release -p:UseLocalSiblings=false -- Chess.Web/wwwroot/sdfcache Chess.Lib/Fonts/Merida.ttf Chess.Lib/Fonts/DejaVuSans.ttf

      # No sibling checkout in CI: Chess.Lib -> DIR.Lib and WebGl.Renderer resolve from NuGet.
      # RunAOTCompilation: Mono WASM AOT — interpreted negamax stalls seconds/move at depth 4;
      # AOT'd Chess.Lib erases that (measured 24-42x on pure compute in the tianwen A/B). Costs
      # a few MB of dotnet.native.wasm and extra CI minutes, so CI-only — local dev publishes
      # stay interpreted and fast. Escape hatches if an assembly ever fails to AOT-compile:
      # -p:_AOT_InternalForceInterpretAssemblies=<AsmName>, then -p:WasmDedup=false.
      - name: Publish Chess.Web (Release)
        run: dotnet publish Chess.Web/Chess.Web.csproj -c Release -o publish -p:UseLocalSiblings=false -p:RunAOTCompilation=true --nologo

      - name: Rewrite base href for the /chess/ project-site subpath
        run: |
          set -euo pipefail
          idx="publish/wwwroot/index.html"
          # github.io serves this project site under /chess/, not root. Local dev
          # keeps <base href="/" />; patch only the published copy.
          sed -i 's|<base href="/" />|<base href="/chess/" />|' "$idx"
          grep -q '<base href="/chess/" />' "$idx" || { echo "base href not rewritten"; exit 1; }

      - name: SPA 404 fallback + .nojekyll
        run: |
          set -euo pipefail
          # Jekyll strips _framework/ (leading underscore) — .nojekyll disables Jekyll.
          touch publish/wwwroot/.nojekyll
          # Static hosts 404 on client-side deep links; GitHub Pages serves 404.html
          # for unknown paths, so a copy of index.html makes routes resolve.
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    # A pull_request run stops after build: it proves the AOT publish still works without
    # putting an unmerged branch on the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
