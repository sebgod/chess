name: CI

# Markdown-only changes skip the whole workflow. Without this a docs commit ran the
# test job, the android gate AND all six publish legs, then cut a release -- which is
# how a design-doc edit came to produce a cross-platform release.
#
# The ignore list is deliberately narrow: `**/*.md` and nothing else. Getting a paths
# filter wrong is asymmetric -- too broad means CI silently does not run on a real
# change, too narrow only means it runs when it need not -- so err toward running. A
# doc asset that is not markdown (a diagram added under docs/) therefore still triggers
# a full run, on purpose. Note also that a push touching code AND docs still runs
# everything: the workflow is skipped only when EVERY changed path matches.
#
# Safe here because no markdown is a build input (no csproj references one, nothing
# opens one at test time) and `main` has no branch protection or rulesets. That second
# condition is load-bearing: if required status checks are ever turned on, a docs-only
# PR would sit forever waiting for a check this filter prevents from ever reporting,
# and the fix is a no-op job that reports success rather than deleting this filter.
on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**/*.md' ]
  # Cutting a release is a decision, not a side effect of merging. The `release` job below is
  # gated on this event alone; `publish` also accepts it so a dispatch has fresh binaries to
  # attach. Mirrors tianwen, where release piggybacks off a dispatch-gated publish.
  workflow_dispatch:

env:
  # Version identity, in the shape the sibling repos use. The X.Y comes from
  # Directory.Build.props (resolved in `test` below) and is NOT restated here -- an older
  # layout in the siblings declared it in both places and they drifted.
  #   Version     = X.Y.<run_number>+<sha>   informational, what `--version` shows
  #   FileVersion = X.Y.<run_number>.<attempt>
  # A re-run of the same run_number therefore differs only in the attempt component.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}

jobs:

  test:
    runs-on: ubuntu-latest
    outputs:
      version-prefix: ${{ steps.resolve-version.outputs.prefix }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # Read the X.Y back out of the props file rather than restating it here, so the version
    # lives in exactly one place. `-getProperty` only EVALUATES the file: nothing is built and
    # no restore is needed, so this costs a second. The guard matters because a typo or a
    # renamed property yields an EMPTY string, which would otherwise sail through and tag a
    # release `v.142`.
    - name: Resolve version
      id: resolve-version
      shell: bash
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo | tr -d '[:space:]')"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "prefix=${MM}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "Resolved VERSION_PREFIX=${MM}.${{ github.run_number }}"
    - run: dotnet test --configuration Release

  # The Android head is deliberately outside Chess.sln: an Android TFM in the solution
  # would force the android workload (and a JDK, and the Android SDK) on everyone who
  # builds it, the `test` job above included. The cost of staying out is that nothing
  # compiled it -- a change to Chess.Lib/Chess.UCI/Chess.Net could break the Android head
  # and still show green. This job is that missing gate.
  #
  # Chess.Web is NOT the same arrangement, though it used to be described as one. It joined
  # Chess.sln, so the `test` job above compiles it and this kind of gate job is unnecessary:
  # its TFM is plain net10.0 (the browser-wasm asset pipeline comes from the in-box
  # BlazorWebAssembly SDK) and only the AOT publish needs the wasm-tools workload, which
  # pages.yml installs for itself. That is the difference from Android, where the workload
  # is needed to compile at all.
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # The Android SDK itself is preinstalled on the runner, but pin the JDK: .NET Android
    # wants 17, and the image's default has moved on.
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - run: dotnet workload install android
    # Provisions any platform/build-tools the runner image happens to be missing, so a
    # bump of the target API doesn't turn into a red build waiting on an image refresh.
    - name: Install Android SDK dependencies
      run: >
        dotnet build Chess.Droid/Chess.Droid.csproj -t:InstallAndroidDependencies
        -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
        -p:UseLocalSiblings=false
    # UseLocalSiblings=false: no sibling checkout here, so DIR.Lib and SdlVulkan.Renderer
    # resolve from NuGet -- the same path a clean clone takes.
    - name: Build Chess.Droid
      run: dotnet build Chess.Droid/Chess.Droid.csproj -c Release -p:UseLocalSiblings=false --nologo

  # The database security rules are the ONLY logic in this repository that does not live in the C#
  # tree, and the only part a client cannot re-check for itself: a client that believes the history
  # is append-only is no use if the server disagrees. Nothing else can catch a regression in them,
  # which is the same argument that earns the `android` job above its keep.
  #
  # No Firebase account, project, login or secret is involved, and that was VERIFIED rather than
  # assumed: the suite passes 23/23 with HOME pointed at an empty directory, and the config store it
  # creates there holds one key (`motd`). The "demo-" project id prefix is what makes the emulator
  # run fully offline.
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
    - uses: actions/checkout@v7
    # firebase-tools needs a JDK 21+ to run the database emulator. This pin is independent of the
    # `android` job's JDK 17 because they are separate jobs on separate runners -- the conflict only
    # exists on a developer's single machine, where the fix is PATH for one command and never
    # JAVA_HOME (see firebase/rules.test.mjs).
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: firebase/package-lock.json
    # `npm ci`, not `npm install`: the point of a gate job is to run what the lockfile pins.
    - run: npm ci
    - run: npm test

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    env:
      VERSION_PREFIX: ${{ needs.test.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-latest,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-latest,     rid: osx-x64 }

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # `shell: bash` is load-bearing on the windows legs: the default there is PowerShell, which
    # does not expand ${VERSION_PREFIX} and would publish a literal string as the version.
    - name: Publish Chess.Console
      run: dotnet publish Chess.Console/Chess.Console.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV}
      shell: bash
    - name: Publish Chess.GUI
      run: dotnet publish Chess.GUI/Chess.GUI.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV}
      shell: bash
    # retention-days is explicit because the default is 90, and six RIDs x two apps x every
    # push to main is how this repo accumulated 3.92 GB of live artifacts. 14 days outlives any
    # plausible "grab the binary from that merge" request; anything meant to last belongs on a
    # release instead.
    - uses: actions/upload-artifact@v7
      with:
        name: chess-console-${{ matrix.rid }}
        path: Chess.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/
        retention-days: 14
    - uses: actions/upload-artifact@v7
      with:
        name: chess-gui-${{ matrix.rid }}
        path: Chess.GUI/bin/Release/net10.0/${{ matrix.rid }}/publish/
        retention-days: 14

  # The Microsoft Store package. Separate from `publish` because it is Windows-only, needs the SDK
  # build tools rather than just the .NET SDK, and produces ONE artifact spanning two architectures
  # rather than one per RID.
  #
  # The bundle this uploads is UNSIGNED, and that is not an oversight: the Store re-signs after
  # certification, which is the whole reason chess is packaged as MSIX at all (no certificate to buy
  # or rotate, and no SmartScreen warning). The consequence is that the artifact cannot be installed
  # by double-clicking it -- an unsigned MSIX is a hard refusal with no "run anyway". To try a CI
  # build locally, sign it with a throwaway certificate first; the summary step below prints how.
  msix:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: windows-latest
    env:
      # Four parts with a zero revision, which is what MSIX wants and Partner Center enforces: the
      # Store reserves the fourth component for its own use and rejects a non-zero one at upload.
      MSIX_VERSION: ${{ needs.test.outputs.version-prefix }}.0
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Cheap, and first: a manifest typo or a mis-sized asset should fail in seconds rather than
    # after two AOT publishes.
    - name: Validate the manifest
      run: ./packaging/windows/msix/build-msix.ps1 -ValidateOnly
      shell: pwsh

    # Both architectures from one x64 runner. Cross-target NativeAOT for win-arm64 already works
    # here -- the `publish` job above has been doing exactly that on windows-latest.
    - name: Publish and pack each architecture
      shell: pwsh
      run: |
        foreach ($rid in 'win-x64', 'win-arm64') {
          $arch = $rid -replace '^win-', ''
          Write-Host "::group::$rid"
          dotnet publish Chess.GUI/Chess.GUI.csproj -r $rid -c Release `
            -p:Version="$env:VERSION_PREFIX$env:VERSION_HASH" -p:FileVersion="$env:VERSION_PREFIX.$env:VERSION_REV"
          if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }
          ./packaging/windows/msix/build-msix.ps1 `
            -PublishDir "Chess.GUI/bin/Release/net10.0/$rid/publish" `
            -Arch $arch -Version $env:MSIX_VERSION -OutFile "artifacts/Chess-$arch.msix"
          Write-Host '::endgroup::'
        }
      env:
        VERSION_PREFIX: ${{ needs.test.outputs.version-prefix }}

    # One .msixbundle spanning both architectures is what Partner Center takes for a multi-arch
    # submission, and what a tester wants: Windows picks the right package for the machine.
    - name: Bundle
      run: ./packaging/windows/msix/build-msix.ps1 -BundleDir artifacts -BundleVersion $env:MSIX_VERSION -BundleOut bundle/Chess.msixbundle
      shell: pwsh

    - name: How to install this artifact
      shell: pwsh
      run: |
        @"
        ### Chess $env:MSIX_VERSION (unsigned)

        The Store re-signs on certification, so CI builds are unsigned and **cannot be installed as
        downloaded** -- there is no click-through for an untrusted MSIX. To try this build:

        ``````powershell
        ./packaging/windows/msix/build-msix.ps1 -SignPackage Chess.msixbundle
        # once, ELEVATED, to trust the throwaway certificate:
        Import-Certificate -FilePath Chess.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
        # then, no elevation:
        Add-AppxPackage Chess.msixbundle
        ``````
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

    - uses: actions/upload-artifact@v7
      with:
        name: chess-msix
        path: |
          bundle/Chess.msixbundle
          artifacts/Chess-*.msix
        retention-days: 14

  # The Google Play package. Same shape as `msix` above, and there for the same reason: a store
  # build is not the tarball with a different extension, and what rejects it is a checklist rather
  # than a compiler.
  #
  # It differs from msix in one way that matters. An MSIX goes up unsigned because the Store signs
  # it at certification; a bundle must be signed BEFORE upload even though Play re-signs it too,
  # because the upload key is how Play knows the upload is yours. Play also rejects the debug key
  # specifically. So: signed here when the upload key is configured, debug-signed otherwise -- and
  # the job still runs in that case, because the checks below are worth having on every push
  # whether or not anyone can upload the result.
  aab:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    env:
      # versionName is human-facing and matches every other artifact from this run. versionCode is
      # the run number alone: Play wants a strictly increasing integer, shows it to nobody, and
      # refuses an upload that does not beat the last one.
      APP_VERSION_NAME: ${{ needs.test.outputs.version-prefix }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # JDK 17, not the image default -- same pin and same reason as the `android` gate job above.
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - run: dotnet workload install android
    - name: Install Android SDK dependencies
      run: >
        dotnet build Chess.Droid/Chess.Droid.csproj -t:InstallAndroidDependencies
        -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
        -p:UseLocalSiblings=false

    # The upload key, when there is one. Written to RUNNER_TEMP rather than the checkout so no
    # artifact path can sweep it up, and deleted with the runner.
    - name: Restore the upload keystore
      id: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::notice::No ANDROID_KEYSTORE_BASE64 secret. Building a debug-signed bundle, which Play will refuse."
          echo "signed=false" >> "$GITHUB_OUTPUT"
        else
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"
        fi

    # The cloud backend, when there is one. Same secret and same shape as the web deploy in
    # pages.yml, and absent is a normal state: the bundle simply never offers "Online game".
    #
    # The API KEY inside it must be the NATIVE one. The browser key is restricted to
    # sebgod.github.io/*, and an HTTP-referrer restriction refuses a request that sends no Referer --
    # which every native client does. The config carries that as an `apiKeyNative` override; see
    # docs/correspondence-play.md, "One key per front-end".
    - name: Write the backend config
      env:
        FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
      run: |
        if [ -z "$FIREBASE_CONFIG" ]; then
          echo "::notice::No FIREBASE_CONFIG secret. Online play will be absent from this bundle."
          exit 0
        fi
        printf '%s' "$FIREBASE_CONFIG" > Chess.Droid/firebase-config.json
        python3 -c "import json; json.load(open('Chess.Droid/firebase-config.json'))"
        # A warning rather than a failure: a project whose single key is unrestricted needs no
        # override. But when the override is missing by ACCIDENT nothing else ever says so -- the
        # bundle builds, ships, and 403s at sign-in on every device it reaches.
        if ! python3 -c "import json,sys; sys.exit(0 if json.load(open('Chess.Droid/firebase-config.json')).get('apiKeyNative') else 1)"; then
          echo "::warning::FIREBASE_CONFIG has no apiKeyNative. Native clients will use the browser key, which fails sign-in if it is referrer-restricted."
        fi
        echo "Backend config written ($(wc -c < Chess.Droid/firebase-config.json) bytes)."

    # env: rather than the literal password, because MSBuild properties land in a process command
    # line that anything on the machine can read.
    - name: Publish the app bundle
      env:
        ANDROID_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        common=(Chess.Droid/Chess.Droid.csproj -c Release --nologo
                -p:UseLocalSiblings=false
                "-p:ApplicationVersion=$APP_VERSION_CODE"
                "-p:ApplicationDisplayVersion=$APP_VERSION_NAME")
        if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
          dotnet publish "${common[@]}" \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/upload.keystore" \
            "-p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningStorePass=env:ANDROID_STORE_PASS \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASS
        else
          dotnet publish "${common[@]}"
        fi

    # The gate this job exists for. 16 KB page alignment is a Play rejection, it comes from a
    # third-party native rather than from anything we wrote, and the build only WARNS about it
    # (XA0141) -- a warning in a publish log is not a gate.
    - name: Check the bundle
      shell: pwsh
      run: |
        $aab = Get-ChildItem Chess.Droid/bin/Release/net10.0-android -Filter '*-Signed.aab' |
               Select-Object -First 1
        if (-not $aab) { throw 'no signed .aab was produced' }
        ./packaging/android/check-aab.ps1 -Bundle $aab.FullName -RequireSignature
        "AAB=$($aab.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: What to do with this artifact
      shell: bash
      run: |
        if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
          SIG="signed with the upload key, so it can go straight to the Play Console"
        else
          SIG="**debug-signed** -- Play refuses it. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets to get an uploadable one"
        fi
        {
          echo "### Chess $APP_VERSION_NAME (versionCode $APP_VERSION_CODE)"
          echo
          echo "This bundle is $SIG."
          echo
          echo "See \`packaging/android/README.md\` for the rest of the Play path."
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v7
      with:
        name: chess-aab
        path: Chess.Droid/bin/Release/net10.0-android/*-Signed.aab
        retention-days: 14

  # Gating: only ship binaries to a GitHub Release on an explicit dispatch, and only when tests
  # passed AND all six publish legs succeeded. Previously this job needed nothing but `publish`,
  # which was gated on main+push alone -- so every merge cut a release. That produced 90 of them
  # (`build-1` .. `build-141`), 996 assets and 8.04 GB that never expires, none of it carrying a
  # version anyone could act on.
  #
  # `needs: test` is not redundant with `needs: publish`: publish already depends on test, but
  # this job reads test's version-prefix OUTPUT, and an output is only readable from a job named
  # in your own `needs`.
  release:
    needs: [test, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_PREFIX: ${{ needs.test.outputs.version-prefix }}
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Create release archives
      run: |
        cd artifacts
        for dir in chess-*/; do
          name="${dir%/}"
          tar -czf "../${name}.tar.gz" -C "$dir" .
        done
    # SharpAstro/action-gh-release, not softprops/action-gh-release, and the fork IS the point.
    #
    # A `uses:` tag is not a version, it is a moving pointer in a repo someone else controls. An
    # action runs arbitrary code inside this job, and this job holds `contents: write` -- so
    # whoever can move `@v2` can push a commit, or read any secret the job can see. Nothing about
    # the reference changes when they do; the same line keeps building, green, against different
    # code. That is not hypothetical: it is how the tj-actions/changed-files compromise reached
    # thousands of repos, by retagging.
    #
    # Forking moves the tag under an account we control, so the code this line resolves to can
    # only change when WE change it. The cost is that upstream fixes are not automatic -- the fork
    # sits at softprops v3.0.0 while upstream is v3.0.2 -- so pulling upstream periodically is
    # part of owning it. Pinning a full commit SHA would give the same immutability without a
    # fork, but then every bump is a 40-character churn and Dependabot owns the tag anyway.
    #
    # The policy this follows, from tianwen: nothing outside `actions/*` runs un-forked. GitHub's
    # own actions are the deliberate exception -- same mutable-tag exposure, but trusting them is
    # already implied by running on their runners at all.
    - name: Create GitHub Release
      uses: SharpAstro/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION_PREFIX }}
        name: v${{ env.VERSION_PREFIX }}
        generate_release_notes: true
        files: chess-*.tar.gz
