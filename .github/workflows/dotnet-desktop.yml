name: CI

# Markdown-only changes skip the whole workflow. Without this a docs commit ran the
# test job, the android gate AND all six publish legs, then cut a release -- which is
# how a design-doc edit came to produce a cross-platform release.
#
# The ignore list is deliberately narrow: `**/*.md` and nothing else. Getting a paths
# filter wrong is asymmetric -- too broad means CI silently does not run on a real
# change, too narrow only means it runs when it need not -- so err toward running. A
# doc asset that is not markdown (a diagram added under docs/) therefore still triggers
# a full run, on purpose. Note also that a push touching code AND docs still runs
# everything: the workflow is skipped only when EVERY changed path matches.
#
# Safe here because no markdown is a build input (no csproj references one, nothing
# opens one at test time) and `main` has no branch protection or rulesets. That second
# condition is load-bearing: if required status checks are ever turned on, a docs-only
# PR would sit forever waiting for a check this filter prevents from ever reporting,
# and the fix is a no-op job that reports success rather than deleting this filter.
on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**/*.md' ]
  # Cutting a release is a decision, not a side effect of merging. The `release` job below is
  # gated on this event alone; `publish` also accepts it so a dispatch has fresh binaries to
  # attach. Mirrors tianwen, where release piggybacks off a dispatch-gated publish.
  workflow_dispatch:

env:
  # Version identity, in the shape the sibling repos use. The X.Y comes from
  # Directory.Build.props (resolved in `test` below) and is NOT restated here -- an older
  # layout in the siblings declared it in both places and they drifted.
  #   Version     = X.Y.<run_number>+<sha>   informational, what `--version` shows
  #   FileVersion = X.Y.<run_number>.<attempt>
  # A re-run of the same run_number therefore differs only in the attempt component.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}

jobs:

  test:
    runs-on: ubuntu-latest
    outputs:
      version-prefix: ${{ steps.resolve-version.outputs.prefix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # Read the X.Y back out of the props file rather than restating it here, so the version
    # lives in exactly one place. `-getProperty` only EVALUATES the file: nothing is built and
    # no restore is needed, so this costs a second. The guard matters because a typo or a
    # renamed property yields an EMPTY string, which would otherwise sail through and tag a
    # release `v.142`.
    - name: Resolve version
      id: resolve-version
      shell: bash
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo | tr -d '[:space:]')"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "prefix=${MM}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "Resolved VERSION_PREFIX=${MM}.${{ github.run_number }}"
    - run: dotnet test --configuration Release

  # The Android head is deliberately outside Chess.sln: an Android TFM in the solution
  # would force the android workload (and a JDK, and the Android SDK) on everyone who
  # builds it, the `test` job above included. The cost of staying out is that nothing
  # compiled it -- a change to Chess.Lib/Chess.UCI/Chess.Net could break the Android head
  # and still show green. This job is that missing gate.
  #
  # Chess.Web is NOT the same arrangement, though it used to be described as one. It joined
  # Chess.sln, so the `test` job above compiles it and this kind of gate job is unnecessary:
  # its TFM is plain net10.0 (the browser-wasm asset pipeline comes from the in-box
  # BlazorWebAssembly SDK) and only the AOT publish needs the wasm-tools workload, which
  # pages.yml installs for itself. That is the difference from Android, where the workload
  # is needed to compile at all.
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # The Android SDK itself is preinstalled on the runner, but pin the JDK: .NET Android
    # wants 17, and the image's default has moved on.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: dotnet workload install android
    # Provisions any platform/build-tools the runner image happens to be missing, so a
    # bump of the target API doesn't turn into a red build waiting on an image refresh.
    - name: Install Android SDK dependencies
      run: >
        dotnet build Chess.Droid/Chess.Droid.csproj -t:InstallAndroidDependencies
        -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
        -p:UseLocalSiblings=false
    # UseLocalSiblings=false: no sibling checkout here, so DIR.Lib and SdlVulkan.Renderer
    # resolve from NuGet -- the same path a clean clone takes.
    - name: Build Chess.Droid
      run: dotnet build Chess.Droid/Chess.Droid.csproj -c Release -p:UseLocalSiblings=false --nologo

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    env:
      VERSION_PREFIX: ${{ needs.test.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-latest,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-latest,     rid: osx-x64 }

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # `shell: bash` is load-bearing on the windows legs: the default there is PowerShell, which
    # does not expand ${VERSION_PREFIX} and would publish a literal string as the version.
    - name: Publish Chess.Console
      run: dotnet publish Chess.Console/Chess.Console.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV}
      shell: bash
    - name: Publish Chess.GUI
      run: dotnet publish Chess.GUI/Chess.GUI.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV}
      shell: bash
    # retention-days is explicit because the default is 90, and six RIDs x two apps x every
    # push to main is how this repo accumulated 3.92 GB of live artifacts. 14 days outlives any
    # plausible "grab the binary from that merge" request; anything meant to last belongs on a
    # release instead.
    - uses: actions/upload-artifact@v4
      with:
        name: chess-console-${{ matrix.rid }}
        path: Chess.Console/bin/Release/net10.0/${{ matrix.rid }}/publish/
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: chess-gui-${{ matrix.rid }}
        path: Chess.GUI/bin/Release/net10.0/${{ matrix.rid }}/publish/
        retention-days: 14

  # Gating: only ship binaries to a GitHub Release on an explicit dispatch, and only when tests
  # passed AND all six publish legs succeeded. Previously this job needed nothing but `publish`,
  # which was gated on main+push alone -- so every merge cut a release. That produced 90 of them
  # (`build-1` .. `build-141`), 996 assets and 8.04 GB that never expires, none of it carrying a
  # version anyone could act on.
  #
  # `needs: test` is not redundant with `needs: publish`: publish already depends on test, but
  # this job reads test's version-prefix OUTPUT, and an output is only readable from a job named
  # in your own `needs`.
  release:
    needs: [test, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_PREFIX: ${{ needs.test.outputs.version-prefix }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create release archives
      run: |
        cd artifacts
        for dir in chess-*/; do
          name="${dir%/}"
          tar -czf "../${name}.tar.gz" -C "$dir" .
        done
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION_PREFIX }}
        name: v${{ env.VERSION_PREFIX }}
        generate_release_notes: true
        files: chess-*.tar.gz
